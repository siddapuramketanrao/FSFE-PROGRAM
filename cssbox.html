<!DOCTYPE html>
<html> 
    <head>
    <title>CSS Box Example</title>
    <style>
        .box {
            width: 300px;
            height: 150px;
            background-color: lightblue;
            border: 3px solid blue;
            padding: 20px;
            margin: 30px;
        }
    </style> 
    </head>
<body>
    <div class="box">
        <h2>Welcome</h2>
        <p>This is a css box.</p>
        </div>
        </body>
        </html>
