
<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
</head>

<body style="background-color:#252525; color:white;">

<h3>Task 2.2</h3>
<h3>Employee Registration Form:</h3>

<form style="background-color:lightyellow; color:black; width:380px; padding:10px;">

    <h2>Employee Registration Form</h2>

    Employee Name:
    <input type="text" placeholder="Enter your name"><br><br>

    Password:
    <input type="password"><br><br>

    Email:
    <input type="email"><br><br>

    Mobile Number:
    <input type="tel"><br><br>

    Age:
    <input type="number" min="1" max="100" style="width:60px;"><br><br>

    Date of Birth:
    <input type="date"><br><br>

    Preferred Interview Time:
    <input type="time"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    Skills:
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript
    <br><br>

    Select Department:
    <select>
        <option>Select Department</option>
        <option>IT</option>
        <option>HR</option>
        <option>Finance</option>
    </select>
    <br><br>

    Upload Resume:
    <input type="file"><br><br>

    Address:
    <textarea rows="5" cols="35" placeholder="Enter your address"></textarea>
    <br><br>

    Work Experience:
    <input type="range"><br><br>

    LinkedIn Profile:
    <input type="url" placeholder="Enter LinkedIn URL">
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="reset">

</form>

</body>
</html>
